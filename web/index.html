<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Brick Like This — online</title>
    <meta
      name="description"
      content="A digital take on the LEGO party game, where the models are built from your own bricks."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Added to a phone's home screen this is the icon, and iOS flattens any
         transparency onto black — so this one is pre-flattened onto the site's
         own background rather than left cut out. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The full title is too long to sit under an icon; iOS truncates it. -->
    <meta name="apple-mobile-web-app-title" content="Brick Like This" />
    <meta name="theme-color" content="#47a89f" />
  </head>
  <body>
    <div id="root"></div>
